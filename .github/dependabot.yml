version: 2
updates:
  # The root lockfile covers every workspace (packages/*, worker), so this one
  # entry updates worker deps too. A separate "/worker" entry has no lockfile
  # to update and produces PRs that fail `npm ci`.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      types:
        patterns: ["@types/*"]
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler"]
      mcp:
        patterns: ["@modelcontextprotocol/*", "agents"]
      tooling:
        patterns: ["typescript", "vitest", "@vitest/*"]
    ignore:
      # The worker tests run on @cloudflare/vitest-pool-workers, which (as of
      # 0.23.0) peers on vitest ^4.1. Drop this once it accepts vitest 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
