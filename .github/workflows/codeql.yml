name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read
  security-events: write
  # Telemetry post-step in github/codeql-action/analyze fetches workflow-run
  # metadata; without actions:read it fails the whole job even though the
  # scan itself succeeded (no findings).
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5e316336eb4f107009e477d4bfbfff13d7250fae # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@5e316336eb4f107009e477d4bfbfff13d7250fae # v4
        with:
          category: "/language:${{ matrix.language }}"
