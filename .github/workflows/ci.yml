name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdio:
    name: stdio (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Smoke (real binary, fake browser)
        run: node examples/smoke.mjs

  worker:
    name: worker (Cloudflare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npx vitest run
      - name: Bundle dry-run (catches build-time errors before deploy)
        run: npx wrangler deploy --dry-run --outdir=.dry-run

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Audit root
        run: npm audit --omit=dev --audit-level=high
      - name: Audit worker
        run: npm audit --omit=dev --audit-level=high
        working-directory: worker
