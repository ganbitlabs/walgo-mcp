name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdio:
    name: stdio (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Smoke (real binary, fake browser)
        run: node examples/smoke.mjs

  worker:
    name: worker (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install (root resolves all workspaces)
        run: npm ci
      - name: Type-check
        run: npm run typecheck --workspace=worker
      - name: Test
        run: npx vitest run
        working-directory: worker
      - name: Bundle dry-run (catches build-time errors before deploy)
        run: npx wrangler deploy --dry-run --outdir=.dry-run
        working-directory: worker

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      # The workspace lockfile lives at the root and covers both stdio + worker
      # deps, so a single audit at root catches CVEs across the whole tree.
      - run: npm audit --omit=dev --audit-level=high
