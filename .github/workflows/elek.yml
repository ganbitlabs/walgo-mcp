name: elek
on:
  pull_request: { types: [opened, synchronize, reopened, ready_for_review] }

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: elek-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elek:
    uses: ganbitlabs/shared-workflows/.github/workflows/elek.yml@3eb7bc6baab4aab47e312e0c0433316477f40eb1 # v1.0.7
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
