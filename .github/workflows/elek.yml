name: elek
on:
  pull_request: { types: [opened, synchronize, reopened, ready_for_review] }

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: elek-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elek:
    uses: ganbitlabs/shared-workflows/.github/workflows/elek.yml@a7c6d429e30dce8dc18e2207babc19c4d7839c6a # v1.0.6
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
